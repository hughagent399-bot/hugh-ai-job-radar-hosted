<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hugh AI Job Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#fbfaf8;--surface:#fff;--surface2:#f6f5f3;--text:#1f1e1c;--muted:#77716b;--faint:#aaa49d;--line:rgba(30,28,25,.11);--line2:rgba(30,28,25,.07);--blue:#2563eb;--green:#0f8f68;--amber:#b7791f;--shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.04)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:1120px;margin:0 auto;padding:32px 24px 64px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:24px}.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}.title{font-size:30px;line-height:1.1;letter-spacing:-.035em;font-weight:700;margin:0}.meta{margin-top:8px;color:var(--muted);font-size:14px}.summary{display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.summary b{color:var(--text);font-size:16px;margin-right:4px}.panel,.lock{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:grid;grid-template-columns:1fr repeat(3,160px);gap:8px;padding:12px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.72);position:sticky;top:0;z-index:2;backdrop-filter:blur(12px)}input,select,button{height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:500 13px Inter,system-ui,sans-serif;padding:0 11px;outline:none}input,select{width:100%}button{background:var(--text);color:#fff;border-color:var(--text);padding:0 16px;cursor:pointer}.count{padding:11px 16px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line2)}.job{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px;gap:16px;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line2);text-decoration:none;color:inherit;background:#fff}.job:hover{background:#fcfbfa}.job:last-child{border-bottom:0}.company{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}.role{font-size:16px;line-height:1.35;font-weight:600;letter-spacing:-.01em}.sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:13px;font-weight:500}.pill.a{background:#eef7f2;color:var(--green);border-color:#cde9dc}.pill.b{background:#f7f5ff;color:#5b4bc4;border-color:#ded8ff}.pill.c{background:#fff7ea;color:var(--amber);border-color:#f1dfb8}.score{text-align:right;font-size:22px;font-weight:700;letter-spacing:-.03em}.score span{display:block;font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin-top:2px}.action{text-align:right;color:var(--muted);font-size:13px;font-weight:600}.empty{padding:48px 16px;text-align:center;color:var(--muted)}.lock{max-width:420px;margin:16vh auto 0;padding:24px}.lock h1{font-size:24px;margin:0 0 8px;letter-spacing:-.03em}.lock p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 18px}.row{display:flex;gap:8px}.error{color:#b42318;font-size:13px;margin-top:10px}@media(max-width:760px){.wrap{padding:22px 14px 48px}.top{display:block}.summary{margin-top:18px}.toolbar{grid-template-columns:1fr 1fr}.job{grid-template-columns:1fr 52px}.action{display:none}.title{font-size:26px}}</style></head>
<body><div id="app"><div class="lock"><div class="label">Private dashboard</div><h1>Hugh AI Job Radar</h1><p>Enter the access key to unlock locally in your browser.</p><form id="unlock" class="row"><input id="pw" type="password" placeholder="Access key" autocomplete="current-password" autofocus><button>Unlock</button></form><div id="err" class="error"></div></div></div>
<script>
let DATA=[],$=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));async function loadPayload(){let m=await fetch('payload-manifest.json',{cache:'no-store'}).then(r=>r.json());let t='';for(let p of m.parts)t+=await fetch(p,{cache:'no-store'}).then(r=>r.text());return JSON.parse(t)}
async function decrypt(password){const p=await loadPayload(),enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ciphertext));return JSON.parse(new TextDecoder().decode(plain))}
function ageDays(j){if(!j.posted_at)return null;let d=new Date(j.posted_at);if(isNaN(d))return null;return Math.max(0,Math.floor((Date.now()-d.getTime())/86400000))}function locOK(j,l){let t=[j.location,j.title,j.description_snippet].join(' ').toLowerCase();if(l==='remote')return !!j.remote;if(l==='nl')return /(amsterdam|netherlands|nederland)/.test(t);if(l==='eu')return /(europe|emea|uk|united kingdom|london|paris|berlin|germany|france|dublin|ireland|remote eu|remote europe|remote emea)/.test(t);return true}function ageLabel(j){let a=ageDays(j);if(a===0)return'posted today';if(a===1)return'posted yesterday';if(a!==null)return`${a}d ago`;return'date unclear'}
function render(){let q=$('q').value.toLowerCase(),p=$('priority').value,l=$('loc').value,f=$('fresh').value;let rows=DATA.filter(j=>{let t=[j.company,j.title,j.location,j.buckets,j.description_snippet].join(' ').toLowerCase(),a=ageDays(j);if(q&&!t.includes(q))return false;if(p==='strong'&&!['A','B'].includes(j.priority))return false;if(p&&p!=='strong'&&j.priority!==p)return false;if(!locOK(j,l))return false;if(f==='today'&&a!==0)return false;if(f==='3'&&(a===null||a>3))return false;if(f==='7'&&(a===null||a>7))return false;return true});rows.sort((a,b)=>{let aa=ageDays(a),bb=ageDays(b);if((aa??999)!==(bb??999))return(aa??999)-(bb??999);return(b.fit_score||0)-(a.fit_score||0)});$('count').textContent=`${rows.length.toLocaleString()} shown`; $('jobs').innerHTML=rows.slice(0,250).map(j=>`<a class="job" href="${esc(j.url)}" target="_blank" rel="noopener"><div><div class="company">${esc(j.company)}</div><div class="role">${esc(j.title)}</div><div class="sub"><span class="pill ${String(j.priority||'').toLowerCase()}">${esc(j.priority)} fit</span><span>${esc(ageLabel(j))}</span><span>${esc(j.location||'Location unclear')}</span></div></div><div class="score">${j.fit_score??'—'}<span>fit</span></div><div class="action">Open ↗</div></a>`).join('')||'<div class="empty">No matches for this view.</div>'}
function mount(d){DATA=d.jobs||[];app.innerHTML=`<div class="wrap"><header class="top"><div><div class="label">Job radar</div><h1 class="title">Best new matches</h1><div class="meta" id="updated"></div></div><div class="summary"><span><b id="todayN">—</b>today</span><span><b id="abN">—</b>A/B fit</span><span><b id="totalN">—</b>active</span></div></header><section class="panel"><div class="toolbar"><input id="q" placeholder="Search company, role, location"><select id="fresh"><option value="today">Today</option><option value="3">3 days</option><option value="7">7 days</option><option value="all">All active</option></select><select id="priority"><option value="strong">A/B fit</option><option value="">All scores</option><option value="A">A only</option><option value="B">B only</option><option value="C">C only</option></select><select id="loc"><option value="">All locations</option><option value="nl">NL / Amsterdam</option><option value="eu">Europe</option><option value="remote">Remote</option></select></div><div class="count" id="count">—</div><div class="jobs" id="jobs"></div></section></div>`;$('totalN').textContent=DATA.length.toLocaleString();$('todayN').textContent=DATA.filter(j=>ageDays(j)===0).length.toLocaleString();$('abN').textContent=DATA.filter(j=>['A','B'].includes(j.priority)).length.toLocaleString();$('updated').textContent=`Updated ${new Date(d.generated_at||Date.now()).toLocaleString([], {dateStyle:'medium', timeStyle:'short'})}`;['q','priority','loc','fresh'].forEach(id=>$(id).addEventListener('input',render));render()}
unlock.addEventListener('submit',async e=>{e.preventDefault();err.textContent='Unlocking…';try{let d=await decrypt(pw.value);sessionStorage.setItem('jobRadarKey',pw.value);mount(d)}catch(ex){err.textContent='Could not unlock. Check the access key.'}});let saved=sessionStorage.getItem('jobRadarKey');if(saved){pw.value=saved;unlock.requestSubmit()}
</script></body></html>
