<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hugh AI Job Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#08090a;--panel:#0f1011;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.05);--text:#f7f8f8;--muted:#8a8f98;--soft:#d0d6e0;--dim:#62666d;--accent:#7170ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(113,112,255,.12),transparent 34rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-feature-settings:"cv01","ss03";letter-spacing:-.01em}.wrap{max-width:1180px;margin:0 auto;padding:34px 20px 56px}.lock{max-width:460px;margin:13vh auto;border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border-radius:18px;padding:24px}.eyebrow{font:500 12px/1.4 'JetBrains Mono',monospace;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}h1{font-size:42px;line-height:1.02;letter-spacing:-.052em;font-weight:600;margin:0 0 10px}.lock h1{font-size:30px}.sub{color:var(--muted);font-size:15px;line-height:1.55}.row{display:flex;gap:10px;margin-top:18px}input,select,button{background:var(--panel);color:var(--soft);border:1px solid var(--border);border-radius:10px;padding:11px 12px;font:500 13px Inter,system-ui}input{width:100%}button{background:#5e6ad2;color:white;cursor:pointer}.error{color:#fca5a5;font-size:13px;margin-top:12px;min-height:18px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}.status{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 14px;min-width:220px}.status b{display:block;font-size:22px}.status span{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0}.stat,.card{border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.048),rgba(255,255,255,.026));border-radius:14px}.stat{padding:13px}.stat .n{font-size:24px;font-weight:600}.stat .l{color:var(--muted);font-size:12px;margin-top:4px}.controls{display:grid;grid-template-columns:1fr 170px 170px 150px;gap:10px;margin:16px 0 18px;position:sticky;top:0;padding:12px 0;background:linear-gradient(to bottom,var(--bg),rgba(8,9,10,.86));backdrop-filter:blur(16px);z-index:2}.count{color:var(--muted);font-size:13px;margin:4px 0 14px}.grid{display:grid;gap:10px}.card{padding:16px 16px 14px}.top{display:grid;grid-template-columns:1fr auto;gap:12px}.company{font-size:13px;color:var(--soft);font-weight:500;margin-bottom:5px}.title{font-size:18px;line-height:1.25;font-weight:600}.title a{color:var(--text);text-decoration:none}.score{font:600 24px/1 Inter;text-align:right}.score small{display:block;font:500 11px/1.4 'JetBrains Mono',monospace;color:var(--dim);margin-top:4px}.meta,.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.pill,.reason{border:1px solid var(--border2);border-radius:999px;color:var(--soft);background:rgba(255,255,255,.03);padding:5px 8px;font-size:12px}.reason{border-radius:7px;color:var(--dim);padding:4px 6px;font-size:11px}.fresh{color:#dffcf2;border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.10)}.snippet{color:var(--muted);font-size:13px;line-height:1.55;max-width:900px;margin-top:12px}.empty{border:1px dashed var(--border);border-radius:14px;color:var(--muted);padding:28px;text-align:center}@media(max-width:760px){header{display:block}.status{margin-top:16px}.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr;position:static}h1{font-size:34px}.top{grid-template-columns:1fr}.score{text-align:left}}</style></head>
<body><div id="app"><div class="lock"><div class="eyebrow">Private dashboard</div><h1>Hugh AI Job Radar</h1><div class="sub">This dashboard is hosted publicly, but the job data is encrypted. Enter the access key to decrypt locally in your browser.</div><form id="unlock" class="row"><input id="pw" type="password" placeholder="Access key" autocomplete="current-password" autofocus><button>Unlock</button></form><div id="err" class="error"></div></div></div>
<script>
let DATA=[],$=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(password){const p=await fetch('payload.json',{cache:'no-store'}).then(r=>r.json());const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ciphertext));return JSON.parse(new TextDecoder().decode(plain))}
function ageDays(j){if(!j.posted_at)return null;let d=new Date(j.posted_at);if(isNaN(d))return null;return Math.max(0,Math.floor((Date.now()-d.getTime())/86400000))}function localKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function isToday(j){if(!j.posted_at)return false;let d=new Date(j.posted_at);return !isNaN(d)&&localKey(d)===localKey(new Date())}function withinDays(j,n){let a=ageDays(j);return a!==null&&a<=n}function ageLabel(j){let a=ageDays(j); if(a===null)return 'posted date unknown'; if(isToday(j))return 'posted today'; if(a<=1)return 'posted yesterday'; return `posted ${a} days ago`}function locOK(j,l){let t=[j.location,j.title,j.description_snippet].join(' ').toLowerCase(); if(l==='remote')return !!j.remote; if(l==='nl')return /(amsterdam|netherlands|nederland)/.test(t); if(l==='eu')return /(europe|emea|uk|united kingdom|london|paris|berlin|germany|france|dublin|ireland|remote eu|remote europe|remote emea)/.test(t); return true}
function render(){let q=$('q').value.toLowerCase(),p=$('priority').value,l=$('loc').value,f=$('fresh').value;let rows=DATA.filter(j=>{let t=[j.company,j.title,j.location,j.buckets,j.description_snippet].join(' ').toLowerCase();if(q&&!t.includes(q))return false;if(p&&j.priority!==p)return false;if(!locOK(j,l))return false;if(f==='today'&&!isToday(j))return false;if(f==='3'&&!withinDays(j,3))return false;if(f==='7'&&!withinDays(j,7))return false;return true});rows.sort((a,b)=>{let aa=ageDays(a),bb=ageDays(b);aa=aa===null?999:aa;bb=bb===null?999:bb;return aa-bb||(b.fit_score||0)-(a.fit_score||0)||String(a.company).localeCompare(b.company)});$('count').textContent=`${rows.length} roles shown · filter: ${$('fresh').selectedOptions[0].textContent}`;$('jobs').innerHTML=rows.length?rows.map(j=>{let fresh=isToday(j)?'fresh':'';let reasons=(j.reasons||[]).slice(0,4).map(r=>`<span class="reason">${esc(r)}</span>`).join('');return `<article class="card"><div class="top"><div><div class="company">${esc(j.company)}</div><div class="title"><a href="${esc(j.url)}">${esc(j.title)}</a></div></div><div class="score">${esc(j.fit_score||0)}<small>fit score</small></div></div><div class="meta"><span class="pill">${esc(j.priority||'D')} priority</span><span class="pill ${fresh}">${ageLabel(j)}</span><span class="pill">${esc(j.location||'Location unclear')}</span>${j.remote?'<span class="pill">remote signal</span>':''}</div><div class="snippet">${esc(j.description_snippet||'')}</div><div class="reasons">${reasons}</div></article>`}).join(''):`<div class="empty">No roles match this filter yet.</div>`}
function mount(d){DATA=d.jobs||[];app.innerHTML=`<div class="wrap"><header><div><div class="eyebrow">Private job radar</div><h1>Same-day AI roles worth applying to.</h1><div class="sub">Prioritised for fresh postings first, then fit across BizOps, Chief of Staff, GTM/RevOps, strategy and AI/deeptech operating roles.</div></div><div class="status"><b id="todayN">0</b><span>posted today</span></div></header><section class="stats"><div class="stat"><div class="n" id="totalN">0</div><div class="l">active roles</div></div><div class="stat"><div class="n" id="weekN">0</div><div class="l">posted this week</div></div><div class="stat"><div class="n" id="abN">0</div><div class="l">A/B fit</div></div><div class="stat"><div class="n" id="nlN">0</div><div class="l">NL / Amsterdam</div></div></section><section class="controls"><input id="q" placeholder="Search company, title, location…"><select id="fresh"><option value="today">Posted today</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option><option value="all">All active roles</option></select><select id="priority"><option value="">All fit scores</option><option>A</option><option>B</option><option>C</option></select><select id="loc"><option value="">All locations</option><option value="nl">NL / Amsterdam</option><option value="eu">Europe / EMEA / UK</option><option value="remote">Remote</option></select></section><div id="count" class="count"></div><main id="jobs" class="grid"></main></div>`;$('totalN').textContent=DATA.length;$('todayN').textContent=DATA.filter(isToday).length;$('weekN').textContent=DATA.filter(j=>withinDays(j,7)).length;$('abN').textContent=DATA.filter(j=>['A','B'].includes(j.priority)).length;$('nlN').textContent=DATA.filter(j=>locOK(j,'nl')).length;['q','priority','loc','fresh'].forEach(id=>$(id).addEventListener('input',render));render()}
unlock.addEventListener('submit',async e=>{e.preventDefault();err.textContent='Decrypting…';try{mount(await decrypt(pw.value));sessionStorage.setItem('jobRadarKey',pw.value)}catch(ex){err.textContent='Could not unlock. Check the access key.'}});let saved=sessionStorage.getItem('jobRadarKey');if(saved){pw.value=saved;unlock.requestSubmit()}
</script></body></html>
